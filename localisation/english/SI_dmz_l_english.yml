  dmz.1.t:0 "[FROM.GetNameDefCap] demands demilitarisation!"
  dmz.1.desc:0 "Diplomatic mission has been sent to us by [FROM.GetNameDef]. They are demanding that we demilitarise certain regions of our country. Although that means they won't be able to demand those states, should we put ourselves in a military disadvantage for land integrity and possibly good relations with [FROM.GetNameDef]?"
  dmz.1.a:0 "We should agree."
  dmz.1.b:0 "We will stand against!"

  dmz.2.t:0 "[FROM.GetNameDefCap] rejects demilitarisation demand"
  dmz.2.desc:0 "Our recent demand of states demilitarisation has been met with an answer. [FROM.GetAdjectiveCap] diplomats have rejected our demilitarisation demand, arguing that they cannot put themselves into a military disadvantage, effectively stating that we are a threat to them."
  dmz.2.a:0 "Theres nothing we can do."
  dmz.2.b:0 "Issue a diplomatic protest."

  dmz.3.t:0 "[FROM.GetNameDefCap] proposes Remilitarisation"
  dmz.3.desc:0 "Diplomatic mission has been sent to us by [FROM.GetNameDef] to offer a proposition of remilitarising some of our lands."
  dmz.3.a:0 "Good proposal!"
  dmz.3.b:0 "We cannot break an agreement."

