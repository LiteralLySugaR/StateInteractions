 sr_event.1.t:0 "[FROM.GetNameDefCap] are offering a resource contract"
 sr_event.1.desc:0 "[FROM.GetAdjectiveCap] diplomats today have came to us with an interesting proposal of giving them rights of raw material in our state of [?FROM.sr_target_state.GetName]. No doubt, this will weaken our resource base, but good economical boost and relations with them may open us to future co-operation programs. What our answer will be?"
 sr_event.1.a:0 "Excellent economic boost!"
 sr_event.1.b:0 "We cannot allow to weaken ourselves!"

 sr_event.2.t:0 "[FROM.GetNameDefCap] are rejecting resource contract"
 sr_event.2.desc:0 "Our diplomats returned from a visit to [FROM.GetNameDef] with an official reply to our recent offer, sadly, not a positive one. [FROM.GetNameDefCap] are rejecting our resource contract offer. They point out that the economic outcome is not viable to them. Although they have a point, can we fully trust and continue diplomatic relations with them?"
 sr_event.2.a:0 "They have a point."
 sr_event.2.b:0 "Issue an embargo!"

 sr_event.3.t:0 "[FROM.GetName] -- Contract termination"
 sr_event.3.desc:0 "The [FROM.GetAdjective] diplomats came today with a notification of termination of our resource contract. Was this a hint for further diplomatic distancing or they want to renew the contract is left unclear, nonetheless the contract appears to be no longer favourable to them."
 sr_event.3.a:0 "We understand."
 sr_event.3.b:0 "Not for us -- not for them!"

 sr_event.4.t:0 "[FROM.GetName] -- Contract termination"
 sr_event.4.desc:0 "The [FROM.GetAdjective] diplomats arrived today with a notification of termination of their resource contract in [?FROM.sr_stateid_cancel_@ROOT.GetName]. Are they done completely or just renewing the contract is left unclear."
 sr_event.4.a:0 "Pleasure to work with you."