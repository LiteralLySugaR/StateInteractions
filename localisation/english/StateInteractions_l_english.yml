 SI_stateview_button:0 "Toggle §YState Interaction§! menu\n--------------------\nActive gamerules:\n- State Transfer (§Y[SiStateTransferGameRule]§!)\n- AI Behaviour (§Y[SiAiBehaviourRule]§!)\n- AI Rejection (§Y[SiAiRejectionRule]§!)\n- Coring Compliance (§Y[SiCoreComplianceRule]§!)\n- Coastal Claiming (§Y[SiClaimShoreRule]§!)\n- Resources Demand (§Y[SiResourceDemandRule]§!)\n- Claim Cooldown (§Y[SiClaimRule]§!)\n- Core Cooldown (§Y[SiCoreRule]§!)\n- Move Capital Cooldown (§Y[SiCapitalRule]§!)\n- Demand Wargoal Cost (§Y[SiWargoalCostRule]§!)\n- Artillery Cooldown (§Y[SiArtilleryRule]§!)\n- Militarisation (§Y[SiMilitarisationRule]§!)\n- Militarisation Cooldown (§Y[SiDmzRule]§!)"

 SI_state_demand_button:0 "Demand §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?FROM.si_demand_state_pp_required] £GFX_pol_power )\n--------------------\n§YAdditional requirements§!\n- §Y[FROM.owner.GetName]§! is §RNOT§! at war with you, your subject or ally\n- §Y[FROM.owner.GetName]§! is §RNOT§! you, your subject or ally\n- §Y[FROM.GetName]§! has border with you or your subject\n- §Y[FROM.GetName]§! is §RNOT§! subject of demands\n- §Y[FROM.GetName]§! is §RNOT§! part of border conflict\n- You are §RNOT§! a subject of another country\n- If §Y[FROM.GetName]§! is coastal then either claimed, or core of yours\n--------------------\nCooldown: §Y[?global.si_demand_state_cooldown_days]§! days (§gMajor interactions§!)"

 SI_state_vsl_button:0 "Demand §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag] Subjugation ([?global.si_demand_vassalisation_pp_required] £GFX_pol_power )\n--------------------\n§YAdditional requirements§!\n- §Y[FROM.owner.GetName]§! is §RNOT§! at war\n- §Y[FROM.owner.GetName]§! is §RNOT§! you, your subject or ally\n- §Y[FROM.owner.GetName]§! is §RNOT§! subject of demands\n- §Y[FROM.owner.GetName]§! has a border with you or your subject\n- §Y[FROM.owner.GetName]§! has §RNOT§! ongoing border conflicts\n- You are §RNOT§! a subject of another country\n--------------------\nCooldown: §Y[?global.si_demand_vassalisation_cooldown_days]§! days (§gMajor interactions§!)"

 SI_state_int_button:0 "Demand §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag] Integration"

 SI_state_claim_button:0 "Claim §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_claim_state_cp_required] £GFX_command_power )\n--------------------\n§YAdditional requirements§!\n- §Y[FROM.owner.GetName]§! is §RNOT§! you, your subject or ally\n- §Y[FROM.owner.GetName]§! has border with you or your subject\n- §Y[FROM.GetName]§! is §RNOT§! claimed by you or core of yours\n--------------------\nCooldown: §Y[?global.si_claim_state_cooldown_days]§! days (§gMinor interactions§!)"

 SI_state_core_button:0 "Core §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?FROM.si_core_state_guns_required] £GFX_infantry_equipment_text_icon [?FROM.si_core_state_cp_required] £GFX_command_power )\n--------------------\n§YAdditional requirements§!\n- §Y[FROM.GetName]§! is owned by you\n- §Y[FROM.GetName]§! is §RNOT§! core of yours\n§gNon-colony states§!:\n- §CCompliance§! is greater than §Y[?global.si_core_state_compliance_required]%§!\n- §OResistance§! is below §Y[?global.si_core_state_resistance_required]%§!\n--------------------\nCooldown: §Y[?global.si_core_state_cooldown_days]§! days (§gMinor interactions§!)"

 SI_state_move_cap_button:0 "Move capital to §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?ROOT.si_move_capital_pp_required] £GFX_pol_power )\n--------------------\n§YAdditional requirements§!\n- §Y[FROM.GetName]§! is owned by you\n- §Y[FROM.GetName]§! is §RNOT§! your capital\n- §Y[FROM.GetName]§! is your core\n--------------------\nCooldown: §Y[?global.si_move_capital_cooldown_days]§! days (§gOther interactions§!)"

 SI_state_border_war_button:0 "Start border-war at §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_border_war_cp_required] £GFX_command_power [?global.si_border_war_pp_required] £GFX_pol_power )\n--------------------\n§YAdditional requirements§!\n- §YYou§! and §Y[FROM.owner.GetName]§! has at least 3 divisions\n- §Y[FROM.GetName]§! is §RNOT§! demilitarised\n- §Y[FROM.GetName]§! is §RNOT§! owned by you, your subject or your ally\n- §Y[FROM.owner.GetName]§! is §RNOT§! subject of any demands\n- Neither §YYou§!, nor §Y[FROM.owner.GetName]§! is at war\n- §RThis will lock major interactions with this country for §Y120 days§!§!\n--------------------\nCooldown: §Y[?global.si_border_war_cooldown_days]§! days (§gMinor interactions§!)"

 SI_state_artillery_button:0 "Start Suppressive Shelling at §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_artillery_cp_required] £GFX_command_power [?global.si_artillery_art_required] £si_artillery_texticon )\n--------------------\n§YAdditional requirements§!\n- §YYou§! and §Y[FROM.owner.GetName]§! are at war with each other\n- §Y[FROM.GetName]§! is §RNOT§! controlled by you, your ally or your subject\n- §Y[FROM.GetName]§! is §RNOT§! target of shelling\n- §Y[FROM.GetName]§! is bordering any allied controlled states\n- There are at least 5 allied divisions in any neighbouring states\n--------------------\nCooldown: §Y[?global.si_artillery_cooldown_days]§! days (§gMinor interactions§!)"

