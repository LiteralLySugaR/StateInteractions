 SI_stateview_button:0 "Переключить меню §YВзаимодействий с Регионами§!\n--------------------\nАктивные правила:\n- Передача регионов (§Y[SiStateTransferGameRule]§!)\n- Поведение ИИ (§Y[SiAiBehaviourRule]§!)\n- Поведение Отказа ИИ (§Y[SiAiRejectionRule]§!)\n- Подчинение для Национализации (§Y[SiCoreComplianceRule]§!)\n- Претензии на берег (§Y[SiClaimShoreRule]§!)\n- Запрос Ресурсов (§Y[SiResourceDemandRule]§!)\n- Перерыв Претензий (§Y[SiClaimRule]§!)\n- Перерыв Национализации (§Y[SiCoreRule]§!)\n- Перерыв Перемещения Столицы (§Y[SiCapitalRule]§!)\n- Стоимость Цели Войны (§Y[SiWargoalCostRule]§!)\n- Перерыв Артиллерии (§Y[SiArtilleryRule]§!)\n- Милитаризация (§Y[SiMilitarisationRule]§!)\n- Перерыв Милитаризации (§Y[SiDmzRule]§!)"

 SI_state_demand_button:0 "Запросить §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?FROM.si_demand_state_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! в войне с вами, вашим субъектом или союзником\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваши субъект или союзник\n- §Y[FROM.GetName]§! имеет границу с вами или вашим субъектом\n- §Y[FROM.GetName]§! §RНЕ§! субъект запросов\n- §Y[FROM.GetName]§! не находиться в состоянии погран конфликта\n- Вы §RНЕ§! субъект другой страны\n- Если §Y[FROM.GetName]§! береговой регион то либо вы претендуете на наго, либо является вашей национальной\n- §Y[FROM.GetName]§! §RНЕ§! демилитаризован\n--------------------\nПерерыв: §Y[?global.si_demand_state_cooldown_days]§! дней (§gКрупное взаимодействие§!)"

 SI_state_vsl_button:0 "Запросить вассализацию §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag] ([?global.si_demand_vassalisation_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! в состоянии войны\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваш субъект или союзник\n- §Y[FROM.owner.GetName]§! §RНЕ§! субъект запрсоов\n- §Y[FROM.owner.GetName]§! имеет границу с вами или вашим субъектом\n- §Y[FROM.owner.GetName]§! §RНЕ§! имеет активных погран конфликтов\n- Вы §RНЕ§! субъект другой страны\n--------------------\nПерерыв: §Y[?global.si_demand_vassalisation_cooldown_days]§! дней (§gКрупное взаимодействие§!)"

 SI_state_int_button:0 "Запросить интеграцию §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag]"

 SI_state_claim_button:0 "Заявить о правах на §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_claim_state_cp_required] £GFX_command_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваш субъект или союзник\n- §Y[FROM.owner.GetName]§! имеет границу с вами или вашим субъектом\n- §Y[FROM.GetName]§! §RНЕ§! заявлено о ваших правах и §RНЕ§! является национальной\n--------------------\nПерерыв: §Y[?global.si_claim_state_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_core_button:0 "национализировать §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?FROM.si_core_state_guns_required] £GFX_infantry_equipment_text_icon [?FROM.si_core_state_cp_required] £GFX_command_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.GetName]§! принадлежит вам\n- §Y[FROM.GetName]§! §RНЕ§! является национальной\n§gНе колониальные регионы:§!\n- §CПодчинение§! более §Y[?global.si_core_state_compliance_required]%§!\n- §OСопротивление§! ниже §Y[?global.si_core_state_resistance_required]%§!\n--------------------\nПерерыв: §Y[?global.si_core_state_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_move_cap_button:0 "Переместить столицу в §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_move_capital_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.GetName]§! принадлежит вам\n- §Y[FROM.GetName]§! §RНЕ§! ваша столица\n- §Y[FROM.GetName]§! является национальной\n--------------------\nПерерыв: §Y[?global.si_move_capital_cooldown_days]§! дней (§gМДругое взаимодействие§!)"

 SI_state_border_war_button:0 "Начать погран войну в §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_border_war_cp_required] £GFX_command_power [?global.si_border_war_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §YВы§! и §Y[FROM.owner.GetName]§! имеете более 2х дивизий\n- §Y[FROM.GetName]§! §RНЕ§! демилитаризован\n- §Y[FROM.GetName]§! владелец §RНЕ§! вы, ваш союзник или субьект\n- §Y[FROM.owner.GetName]§! §RНЕ§! является объектом запросов\n- Ни §YВы§!, ни §Y[FROM.owner.GetName]§! §RНЕ§! находитесь в состоянии войны\n- §RЭто действие зарпетить крупные действия со страной на §Y120 дней§!§!\n--------------------\nПерерыв: §Y[?global.si_border_war_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_artillery_button:0 "Начать Подалвение Артиллерией в §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_artillery_cp_required] £GFX_command_power [?global.si_artillery_art_required] £si_artillery_texticon )\n--------------------\n§YДополнительные требования§!\n- §YВы§! и §Y[FROM.owner.GetName]§! воюете друг с другом\n- Владелец §Y[FROM.GetName]§! §RНЕ§! вы, ваш союзник или субъект\n- §Y[FROM.GetName]§! §RНЕ§! под обстрелом\n- §Y[FROM.GetName]§! граничит с любым регионом под контролем союзных сил\n- В одном из соседних регионов как минимум 5 союзных дивизий\n--------------------\nПерерыв: §Y[?global.si_artillery_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_transfer_menu_button:0 "Переключить меню §YПередачи Регионов§!\n--------------------\n§RЭто утилита, она работает полностью правильно и она не подразумевает замену или представление в виде бесплатной версии запроса регионов или других механик мода. Пожалуйста, не сообщайте о том что эта утилита имба и либо выключите, либо переключите её в многопользовательский режим в правилах игры чтобы сделать её более 'сбалансированной'.§!"

