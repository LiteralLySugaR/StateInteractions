  SI_diplomatic_protest:0 "Дипломатический Протест"
  SI_caved_to_demands:0 "Уступки Требованиям"

  dmz.1.t:0 "[FROM.GetNameDefCap] требует демилитаризацию!"
  dmz.1.desc:0 "К нам направлена ​​дипломатическая миссия от [FROM.GetNameDef]. Они требуют демилитаризации некоторых регионов нашей страны. Хотя это означает, что они не смогут потребовать эти регионы, стоит ли нам ставить себя в невыгодное военное положение ради, возможно, хороших отношений с [FROM.GetNameDef]?"
  dmz.1.a:0 "Нам надо согласиться."
  dmz.1.b:0 "Мы против!"

  dmz.2.t:0 "[FROM.GetNameDefCap] отвергает требования демилитаризации"
  dmz.2.desc:0 "Наше недавнее требование о демилитаризации государств встретило ответ. Дипломаты [FROM.GetAdjectiveCap] отклонили наше требование о демилитаризации, заявив, что они не могут оказаться в невыгодном военном положении, фактически утверждая, что мы представляем для них угрозу."
  dmz.2.a:0 "С этим ничего не поделать."
  dmz.2.b:0 "Выразить дипломатический протест."

  dmz.3.t:0 "[FROM.GetNameDefCap] предлагает ремилитаризацию"
  dmz.3.desc:0 "К нам направлена ​​дипломатическая миссия от [FROM.GetNameDef] с предложением о ремилитаризации некоторых наших земель."
  dmz.3.a:0 "Хорошее предложение!"
  dmz.3.b:0 "Мы не может нарушить установленное соглашение."

  SI_dmz_not_borderwar_locked_tt:0 "§RНЕ§! забловировано §YПогран-Войной§!"
  SI_dmz_not_starting_locked_tt:0 "§RНЕ§! демилитаризован со старта (Действует в течении §Y2.5 года§!)"
  SI_dmz_not_recently_dmzed_tt:0 "§RНЕ§! был недавно §YДемилитаризован§!"
