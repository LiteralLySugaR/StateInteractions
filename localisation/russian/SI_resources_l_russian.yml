 SI_resources_clear_button_tt:0 "Очистить выбор всех ресурсов."
 SI_resources_demand_button_tt:0 "Отправить запрос на права выбранных ресурсов.\n--------------------\n§YТребования§!:\n- Выбран любой ресурс\n- Максимум 2 активных исходящих контракта\n- Достаточно фабрик\n- [FROM.owner.GetName] не в состоянии войны\n- У вас нет других прав на ресурсы в этом регионе\n- Не было недавно крупных запросов\n- Этот регион не является целью недавних запросов.\n- [FROM.owner.GetName] не наложили на нас эмбарго"

 SI_RESOURCES_DEMAND_RULES:0 "Правила запроса ресурсов"
