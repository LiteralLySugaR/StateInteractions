 SI_RULE_RESOURCES_DEMAND_DEFAULT_DESC:0 "Механика запроса ресурсов будет включена."
 SI_RULE_RESOURCES_DEMAND_NOT_RULE:0 "Выключено"
 SI_RULE_RESOURCES_DEMAND_NOT_RULE_DESC:0 "Механика запроса ресурсов будет выключена."

 SI_resource_demand_gamerule_no:0 "Выключено"
 SI_resource_demand_gamerule_yes:0 "Включено"

 sr_event.1.t:0 "[FROM.GetNameDefCap] предлагают контракт на ресурсы"
 sr_event.1.desc:0 "[FROM.GetAdjectiveCap] дипломаты обратились к нам с интересным предложением о предоставлении им прав на ресурсы в [?FROM.sr_target_state.GetName]. Несомненно, это ослабит нашу ресурсную базу, но хороший экономический подъем и отношения с ними могут открыть нам путь к будущим программам сотрудничества. Каким будет наш ответ?"
 sr_event.1.a:0 "Отличный буст экономики!"
 sr_event.1.b:0 "Мы не можем позволить ослабить себя!"

 sr_event.2.t:0 "[FROM.GetNameDefCap] отвергают контракт на ресурсы"
 sr_event.2.desc:0 "Наши дипломаты вернулись из поездки в [FROM.GetNameDef] с официальным ответом на наше недавнее предложение, к сожалению, не положительным. отклоняют наше предложение по контракту на поставку ресурсов. Они указывают на то, что экономический результат для них неприемлем. Хотя в этом есть доля правды, можем ли мы полностью доверять им и продолжать с ними дипломатические отношения?"
 sr_event.2.a:0 "Они правы."
 sr_event.2.b:0 "Наложить эмбарго!"

 sr_event.3.t:0 "[FROM.GetName] -- Разторжение контракта"
 sr_event.3.desc:0 "Сегодня дипломаты [FROM.GetAdjective] прибыли с уведомлением о расторжении нашего контракта на поставку ресурсов. Было ли это намеком на дальнейшее дипломатическое дистанцирование или они хотят пересмотреть контракт, остается неясным, тем не менее, контракт, похоже, больше не выгоден для них."
 sr_event.3.a:0 "Мы понимаем."
 sr_event.3.b:0 "Не для нас -- Не для них!"

 sr_event.4.t:0 "[FROM.GetName] -- Разторжение контракта"
 sr_event.4.desc:0 "Сегодня прибыли дипломаты [FROM.GetAdjective] с уведомлением о расторжении контракта на поставку ресурсов в [?FROM.sr_stateid_cancel_@ROOT.GetName]. Остается неясным, полностью ли расторгнут контракт или же они просто пересматривают его."
 sr_event.4.a:0 "Приятно было иметь с вами дело."